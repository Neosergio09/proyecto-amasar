# Copia de seguridad diaria de la BD de Supabase (roles, esquema y datos, incluido auth.users).
# El repo es público: la copia se cifra con BACKUP_PASSPHRASE (AES-256) antes de subirla
# como artifact. Sin esa contraseña no se puede leer. Cómo restaurar: ver db/BACKUPS.md.
name: Backup BD

on:
  schedule:
    - cron: "0 8 * * *" # 03:00 hora de Bogotá
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3

      - name: Volcar la base de datos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only

      - name: Cifrar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "Falta el secreto BACKUP_PASSPHRASE"; exit 1; }
          echo "NOMBRE=amasar-bd-$(date -u +%F)" >> "$GITHUB_ENV"
          tar -czf - -C backup . \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
                  --passphrase "$BACKUP_PASSPHRASE" -o backup.tar.gz.gpg
          rm -rf backup

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOMBRE }}
          path: backup.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
